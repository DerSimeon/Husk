# Husk Limbo server configuration (HOCON).
# Edit and restart. Delete this file to regenerate defaults.
husk {
  # Address to bind. "0.0.0.0" = all interfaces.
  host = "0.0.0.0"
  port = 25565

  max-players = 100

  # Drop a connection after this many ms with no inbound data.
  read-timeout = 30000

  # Directory scanned for root (*.jar) extensions.
  roots-dir = "roots"

  # Client "brand" string reported to players.
  brand = "Husk"

  # Dimension players spawn in. Must exist in the sent dimension_type registry
  # (e.g. minecraft:overworld, minecraft:the_nether, minecraft:the_end).
  dimension = "minecraft:the_nether"

  # Show the joining player in the tab list.
  player-list = true

  # Server-list ping shown in the multiplayer menu.
  ping {
    # Version text shown by the client. Turns red unless the protocol matches.
    version-name = "Husk"

    # Protocol number reported. -1 = echo the client's own protocol (always shows compatible).
    protocol = -1

    # MOTD, parsed as MiniMessage. Use \n for a second line.
    description = "<gradient:#e117e8:#e80545><bold>Husk Limbo</bold></gradient>\n<gray>drifting in the void</gray>"
  }

  # Player-info forwarding from a proxy in front of Husk.
  #   none     = offline mode, the client's own name/UUID are used (direct connections).
  #   velocity = Velocity "modern" forwarding; players must come through the proxy, and the
  #              name/UUID the proxy forwards are used. Needs the proxy's forwarding secret.
  # Both can be set from the environment: HUSK_FORWARDING_MODE, HUSK_FORWARDING_SECRET.
  forwarding {
    mode = "none"
    mode = ${?HUSK_FORWARDING_MODE}
    secret = ""
    secret = ${?HUSK_FORWARDING_SECRET}
  }
}
